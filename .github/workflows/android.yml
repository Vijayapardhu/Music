name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    #
    # The keystore is optional. app/build.gradle.kts only creates the release
    # signingConfig when the store file actually exists, and otherwise builds
    # app-prod-release-unsigned.apk. That fallback only works if we do not
    # write a keystore here at all: `base64 -d` of an unset secret still
    # creates a zero-byte bitchord-release.jks, which exists() happily accepts,
    # and packaging then dies with "Tag number over 30 is not supported" while
    # trying to read the empty file as a key store.
    #
    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        {
          echo "LASTFM_API_KEY=$LASTFM_API_KEY"
          echo "LASTFM_SECRET=$LASTFM_SECRET"
        } > local.properties

        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Signing keystore found - the release APK will be signed."
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
        else
          echo "::warning::KEYSTORE_BASE64 is not set - building an unsigned release APK."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release
        path: app/build/outputs/apk/prod/release/*.apk
